<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rahi Portfolio Admin</title><link rel="stylesheet" href="admin.css"></head><body><main class="admin-wrap"><a href="/">← Public portfolio</a><header><p class="eyebrow">PRIVATE DASHBOARD</p><h1>Rahi Portfolio Admin</h1><p>Manage your portfolio projects, recitations, certificates, and experiences.</p></header><section id="login-panel" class="panel"><h2>Admin sign in</h2><form id="login-form"><label>Admin password<input id="password" type="password" required></label><button>Sign in</button><p id="login-message" role="status"></p></form></section><section id="dashboard" hidden><div class="panel"><div class="row"><h2>Add portfolio item</h2><button type="button" id="logout" class="secondary">Sign out</button></div><form id="item-form"><label>Title *<input id="title" required maxlength="160"></label><label>Category *<select id="category"><option>Holy Quran Recitation</option><option>Programming</option><option>AI & Technology</option><option>Leadership</option><option>Entrepreneurship</option><option>Volunteering</option></select></label><label>Description<textarea id="description" rows="3"></textarea></label><label>Project link<input id="url" type="url" placeholder="https://..."></label><label>Image or video (max 50 MB)<input id="file" type="file" accept="image/*,video/*"></label><button id="save">Publish item</button><p id="form-message" role="status"></p></form></div><div class="panel"><h2>Published items</h2><div id="items-list"></div></div></section></main><script src="admin.js" defer></script></body></html>
